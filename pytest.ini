; Test automatici del server (vedi CLAUDE.md, sezione "Test"). Si lanciano
; dalla radice del repo: `python3 -m pytest`.
;
; Le prove marcate `rete` contattano YouTube davvero: lente, dipendono dalla
; rete e da YouTube stesso, quindi escluse di default. Si lanciano con
; `python3 -m pytest -m rete` (l'ultimo -m sulla riga di comando vince su
; quello di addopts).
[pytest]
testpaths = server/tests
pythonpath = server
addopts = -m "not rete"
markers =
    rete: prova che contatta YouTube (esclusa di default, lanciarla con -m rete)
