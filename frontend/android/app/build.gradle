apply plugin: 'com.android.application'

// ── Firma dell'APK ────────────────────────────────────────────────────────
// Senza configurazione l'SDK firma i build di debug con ~/.android/debug.keystore,
// che protegge la chiave con la password pubblica "android": chiunque può quindi
// produrre un APK che il telefono accetta come aggiornamento di com.ytproxy.app.
// keystore/ytproxy.jks contiene la *stessa* chiave privata — l'impronta del
// certificato non cambia, quindi gli aggiornamenti continuano a installarsi sopra
// senza disinstallare — ma con una password vera, che sta in keystore.properties
// fuori da git.
//
// Se il file manca (clone fresco, altra macchina) si ricade sulla chiave di debug
// dell'SDK invece di far fallire il build: il progetto resta compilabile da
// chiunque, solo che l'APK risulta firmato da un'altra chiave.
def signingProps = new Properties()
def signingPropsFile = rootProject.file('keystore/keystore.properties')
if (signingPropsFile.exists()) {
    signingPropsFile.withInputStream { signingProps.load(it) }
}
def signingKeystore = signingProps['storeFile'] ? rootProject.file(signingProps['storeFile']) : null
def useOwnKeystore = signingKeystore != null && signingKeystore.exists()
if (!useOwnKeystore) {
    logger.lifecycle("YTProxy: keystore/keystore.properties assente — firmo con la chiave di debug dell'SDK")
}

android {
    namespace = "com.ytproxy.app"
    compileSdk = rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "com.ytproxy.app"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 1
        versionName "1.0"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    signingConfigs {
        if (useOwnKeystore) {
            ytproxy {
                storeFile signingKeystore
                storePassword signingProps['storePassword']
                keyAlias signingProps['keyAlias']
                keyPassword signingProps['keyPassword']
            }
        }
    }
    buildTypes {
        debug {
            if (useOwnKeystore) signingConfig signingConfigs.ytproxy
        }
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
            // Stessa chiave del debug: l'APK non passa da nessuno store, serve solo
            // che il telefono lo riconosca come aggiornamento di quello installato.
            if (useOwnKeystore) signingConfig signingConfigs.ytproxy
        }
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    // androidx.activity: OnBackPressedDispatcher, usato da MainActivity per il
    // tasto Indietro. Arriva già come dipendenza transitiva, ma qui serve in
    // compilazione e dichiararla esplicitamente evita che sparisca.
    implementation "androidx.activity:activity:$androidxActivityVersion"
    // androidx.core: WindowCompat/WindowInsetsControllerCompat, cioè le barre di
    // sistema nascoste a schermo intero (vedi FullscreenWebChromeClient). Stesso
    // discorso di androidx.activity: arriva già da appcompat, ma serve in
    // compilazione e dichiararla evita che sparisca.
    implementation "androidx.core:core:$androidxCoreVersion"
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
