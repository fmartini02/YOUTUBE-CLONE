<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>YTProxy Receiver</title>
  <script src="//www.gstatic.com/cast/sdk/libs/caf_receiver/v3/cast_receiver_framework.js"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      background: #000;
      color: #fff;
      font-family: 'Roboto', sans-serif;
      width: 100vw;
      height: 100vh;
      overflow: hidden;
    }

    /* ── Idle screen ───────────────────────────── */
    #idle {
      position: fixed; inset: 0;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      gap: 20px;
      background: linear-gradient(135deg, #0f0f0f 0%, #1a0000 100%);
    }

    .idle-logo {
      display: flex; align-items: center; gap: 12px;
    }
    .idle-icon { color: #ff0000; font-size: 64px; }
    .idle-text { font-size: 48px; font-weight: 700; letter-spacing: -1px; }
    .idle-badge {
      font-size: 13px; font-weight: 700; color: #ff0000;
      border: 2px solid #ff0000; border-radius: 4px;
      padding: 2px 8px; margin-top: -24px;
    }
    .idle-subtitle { font-size: 18px; color: #aaa; }

    /* ── Video player ──────────────────────────── */
    #player {
      position: fixed; inset: 0;
      background: #000;
      display: none;
    }

    #player video {
      width: 100%; height: 100%;
      object-fit: contain;
    }

    /* ── Overlay (shown on load/pause) ────────── */
    #overlay {
      position: fixed; inset: 0;
      background: linear-gradient(
        to top,
        rgba(0,0,0,0.9) 0%,
        transparent 40%,
        transparent 70%,
        rgba(0,0,0,0.5) 100%
      );
      display: flex; flex-direction: column;
      justify-content: flex-end;
      padding: 48px 64px;
      opacity: 0;
      transition: opacity 0.4s;
      pointer-events: none;
    }
    #overlay.visible { opacity: 1; }

    .overlay-title {
      font-size: 36px; font-weight: 700;
      line-height: 1.2; margin-bottom: 12px;
      text-shadow: 0 2px 8px rgba(0,0,0,0.8);
      max-width: 80%;
    }
    .overlay-channel {
      font-size: 20px; color: #ccc;
      margin-bottom: 24px;
    }

    /* ── Progress bar ──────────────────────────── */
    .progress-wrap {
      width: 100%; height: 4px;
      background: rgba(255,255,255,0.2);
      border-radius: 2px; margin-bottom: 12px;
    }
    .progress-bar {
      height: 100%; background: #ff0000;
      border-radius: 2px; width: 0%;
      transition: width 0.5s linear;
    }

    .time-row {
      display: flex; justify-content: space-between;
      font-size: 14px; color: #ccc;
    }

    /* ── Loading spinner ───────────────────────── */
    #loading {
      position: fixed; inset: 0;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      gap: 24px; background: #000;
      display: none;
    }

    .spinner {
      width: 64px; height: 64px;
      border: 4px solid rgba(255,255,255,0.1);
      border-top-color: #ff0000;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    .loading-title {
      font-size: 22px; color: #ccc;
      max-width: 600px; text-align: center;
      line-height: 1.4;
    }

    /* ── Watermark ─────────────────────────────── */
    .watermark {
      position: fixed; top: 32px; right: 48px;
      display: flex; align-items: center; gap: 8px;
      opacity: 0.6;
    }
    .watermark-icon { color: #ff0000; font-size: 20px; }
    .watermark-text { font-size: 16px; font-weight: 700; }
  </style>
</head>
<body>

  <!-- Idle screen -->
  <div id="idle">
    <div class="idle-logo">
      <span class="idle-icon">▶</span>
      <span class="idle-text">YTProxy</span>
      <span class="idle-badge">AD-FREE</span>
    </div>
    <div class="idle-subtitle">Apri YTProxy sul telefono per iniziare</div>
  </div>

  <!-- Loading -->
  <div id="loading">
    <div class="spinner"></div>
    <div class="loading-title" id="loading-title">Caricamento...</div>
  </div>

  <!-- Player -->
  <div id="player">
    <video id="video" playsinline></video>
    <div id="overlay">
      <div class="overlay-title" id="overlay-title"></div>
      <div class="overlay-channel" id="overlay-channel"></div>
      <div class="progress-wrap">
        <div class="progress-bar" id="progress-bar"></div>
      </div>
      <div class="time-row">
        <span id="time-current">0:00</span>
        <span id="time-total">0:00</span>
      </div>
    </div>
    <div class="watermark">
      <span class="watermark-icon">▶</span>
      <span class="watermark-text">YTProxy</span>
    </div>
  </div>

  <script>
    const context = cast.framework.CastReceiverContext.getInstance();
    const playerManager = context.getPlayerManager();

    const $idle     = document.getElementById("idle");
    const $loading  = document.getElementById("loading");
    const $player   = document.getElementById("player");
    const $overlay  = document.getElementById("overlay");
    const $video    = document.getElementById("video");
    const $title    = document.getElementById("overlay-title");
    const $channel  = document.getElementById("overlay-channel");
    const $progress = document.getElementById("progress-bar");
    const $curTime  = document.getElementById("time-current");
    const $totTime  = document.getElementById("time-total");
    const $loadTitle = document.getElementById("loading-title");

    let overlayTimer = null;

    function showOverlay(duration = 4000) {
      $overlay.classList.add("visible");
      clearTimeout(overlayTimer);
      if (duration > 0) {
        overlayTimer = setTimeout(() => $overlay.classList.remove("visible"), duration);
      }
    }

    function formatTime(secs) {
      if (!secs || isNaN(secs)) return "0:00";
      const h = Math.floor(secs / 3600);
      const m = Math.floor((secs % 3600) / 60);
      const s = Math.floor(secs % 60);
      if (h) return `${h}:${String(m).padStart(2,"0")}:${String(s).padStart(2,"0")}`;
      return `${m}:${String(s).padStart(2,"0")}`;
    }

    // ── Intercept load request ────────────────────────────────────────
    playerManager.setMessageInterceptor(
      cast.framework.messages.MessageType.LOAD,
      (loadRequestData) => {
        const media = loadRequestData.media;
        const customData = media.customData || {};

        // Show loading screen
        $idle.style.display = "none";
        $player.style.display = "none";
        $loading.style.display = "flex";
        $loadTitle.textContent = media.metadata?.title || "Caricamento...";

        // Set metadata for overlay
        $title.textContent   = media.metadata?.title   || "";
        $channel.textContent = media.metadata?.subtitle || "";

        return loadRequestData;
      }
    );

    // ── Player events ─────────────────────────────────────────────────
    playerManager.addEventListener(
      cast.framework.events.EventType.PLAYER_LOAD_COMPLETE,
      () => {
        $loading.style.display = "none";
        $player.style.display = "block";
        showOverlay(5000);
      }
    );

    playerManager.addEventListener(
      cast.framework.events.EventType.PAUSE,
      () => showOverlay(0) // show indefinitely while paused
    );

    playerManager.addEventListener(
      cast.framework.events.EventType.PLAY,
      () => showOverlay(3000)
    );

    playerManager.addEventListener(
      cast.framework.events.EventType.TIME_UPDATE,
      (event) => {
        const cur = playerManager.getCurrentTimeSec();
        const dur = playerManager.getDurationSec();
        if (dur > 0) {
          $progress.style.width = `${(cur / dur) * 100}%`;
          $curTime.textContent = formatTime(cur);
          $totTime.textContent = formatTime(dur);
        }
      }
    );

    playerManager.addEventListener(
      cast.framework.events.EventType.MEDIA_FINISHED,
      () => {
        $player.style.display = "none";
        $idle.style.display = "flex";
      }
    );

    playerManager.addEventListener(
      cast.framework.events.EventType.ERROR,
      (event) => {
        console.error("Player error:", event);
        $loading.style.display = "none";
        $player.style.display = "none";
        $idle.style.display = "flex";
      }
    );

    // ── Start receiver ────────────────────────────────────────────────
    context.start({
      disableIdleTimeout: true,
    });
  </script>
</body>
</html>
